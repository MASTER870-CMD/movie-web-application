<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie World</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f9f9f9, #e3f2fd);
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
      color: #007bff;
      font-weight: 700;
      letter-spacing: 1px;
      animation: fadeInDown 1s ease;
    }

    .search-container {
      text-align: center;
      margin: 30px 0;
      animation: fadeInUp 1s ease;
    }

    .search-container input {
      width: 60%;
      max-width: 500px;
      padding: 12px 20px;
      border: 2px solid #007bff;
      border-radius: 30px;
      outline: none;
      transition: 0.3s;
    }

    .search-container input:focus {
      box-shadow: 0 0 10px rgba(0,123,255,0.4);
    }

    .movie-card {
      border: none;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      transition: transform 0.4s ease, box-shadow 0.3s ease;
      background-color: #fff;
      cursor: pointer;
      animation: fadeIn 0.8s ease;
    }

    .movie-card:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    .movie-card img {
      height: 300px;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .movie-card:hover img {
      transform: scale(1.1);
    }

    .movie-info {
      padding: 20px;
    }

    .rating {
      color: #ffc107;
      font-weight: bold;
      margin-top: 5px;
    }

    .btn-download {
      background-color: #28a745;
      color: white;
      border-radius: 25px;
      transition: background 0.3s ease;
    }

    .btn-download:hover {
      background-color: #218838;
    }

    @keyframes fadeInDown {
      from {opacity: 0; transform: translateY(-20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    @keyframes fadeInUp {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.95);}
      to {opacity: 1; transform: scale(1);}
    }
  </style>
</head>
<body>

  <h1>🎥 Movie World</h1>

  <!-- Search Bar -->
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search for a movie...">
  </div>

  <!-- Movie Container -->
  <div class="container mt-4">
    <div class="row" id="movieContainer">
      <!-- Movies will appear here -->
    </div>
  </div>

  <script>
    const movies = JSON.parse(localStorage.getItem("movies")) || [];
    const movieContainer = document.getElementById("movieContainer");
    const searchInput = document.getElementById("searchInput");

    function displayMovies(filteredMovies = movies) {
      movieContainer.innerHTML = "";

      if (filteredMovies.length === 0) {
        movieContainer.innerHTML = `<p class="text-center text-muted">No movies found.</p>`;
        return;
      }

      filteredMovies.forEach((movie) => {
        const col = document.createElement("div");
        col.className = "col-md-4 mb-4";
        col.innerHTML = `
          <div class="card movie-card">
            <img src="${movie.thumbnail}" class="card-img-top" alt="${movie.title}">
            <div class="movie-info">
              <h5>${movie.title}</h5>
              <p>${movie.description}</p>
              <p class="rating">⭐ ${movie.rating}/5</p>
              <a href="${movie.link}" class="btn btn-download" target="_blank">Download</a>
            </div>
          </div>
        `;
        movieContainer.appendChild(col);
      });
    }

    // Initial display
    displayMovies();

    // Search Functionality
    searchInput.addEventListener("keyup", () => {
      const query = searchInput.value.toLowerCase();
      const filtered = movies.filter(movie =>
        movie.title.toLowerCase().includes(query)
      );
      displayMovies(filtered);
    });
  </script>
</body>
</html>
