<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Movie World</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #ffffff, #e3f2fd);
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      margin-top: 30px;
      color: #007bff;
      font-weight: 700;
      animation: fadeInDown 1s ease;
    }

    .form-container {
      max-width: 600px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      animation: fadeInUp 1s ease;
    }

    @keyframes fadeInUp {
      from {opacity: 0; transform: translateY(30px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .btn-upload {
      background-color: #007bff;
      color: white;
      border-radius: 25px;
      transition: 0.3s;
    }

    .btn-upload:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h1>🎬 Admin Panel</h1>
  <div class="form-container">
    <form id="movieForm">
      <div class="mb-3">
        <label for="thumbnail" class="form-label">Movie Thumbnail (Image URL)</label>
        <input type="text" class="form-control" id="thumbnail" placeholder="Enter image URL" required>
      </div>

      <div class="mb-3">
        <label for="title" class="form-label">Movie Title</label>
        <input type="text" class="form-control" id="title" required>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" rows="3" required></textarea>
      </div>

      <div class="mb-3">
        <label for="rating" class="form-label">Rating (out of 5)</label>
        <input type="number" class="form-control" id="rating" min="1" max="5" step="0.1" required>
      </div>

      <div class="mb-3">
        <label for="link" class="form-label">Movie Download/Watch Link</label>
        <input type="text" class="form-control" id="link" placeholder="Enter movie link" required>
      </div>

      <button type="submit" class="btn btn-upload w-100">Upload Movie</button>
    </form>
  </div>

  <script>
    document.getElementById("movieForm").addEventListener("submit", function(e){
      e.preventDefault();

      const thumbnail = document.getElementById("thumbnail").value;
      const title = document.getElementById("title").value;
      const description = document.getElementById("description").value;
      const rating = document.getElementById("rating").value;
      const link = document.getElementById("link").value;

      const movie = { thumbnail, title, description, rating, link };

      // Save to localStorage
      const movies = JSON.parse(localStorage.getItem("movies")) || [];
      movies.push(movie);
      localStorage.setItem("movies", JSON.stringify(movies));

      alert("✅ Movie uploaded successfully!");
      document.getElementById("movieForm").reset();
    });
  </script>
</body>
</html>
